<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>キャラ素材確認: さと修正版（内部用）</title>
<style>
  body { font-family: -apple-system, 'Hiragino Sans', sans-serif; background: #222; color: #eee; margin: 0; padding: 16px; }
  h2, h3 { text-align: center; }
  h3 { margin-top: 2em; border-bottom: 1px solid #555; padding-bottom: 6px; }
  p.note { font-size: 0.85em; color: #aaa; text-align: center; }
  .hero { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .hero figure { margin: 0; width: min(100%, 440px); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  figure { margin: 0; background: #333; border-radius: 8px; padding: 8px; }
  img { width: 100%; height: auto; border-radius: 6px; background: #fff; display: block; }
  figcaption { font-size: 0.8em; color: #ccc; text-align: center; padding-top: 6px; }
  .fix { color: #ffd54f; font-weight: bold; }
  details { margin-top: 2em; }
  summary { cursor: pointer; font-size: 1.05em; padding: 8px 0; }
</style>
</head>
<body>
<h2>さと 修正版素材（7/10 再生成）</h2>
<p class="note">内部確認用の非公開リンク。V001モックにはこの素材が使われます。確認後にディレクトリごと削除します。</p>

<h3>修正ポイント① 前足の白（base）</h3>
<div class="hero">
  <figure><img src="sato/base.png" alt="sato base"><figcaption>base: <span class="fix">両前足の先端を白に戻しました</span></figcaption></figure>
</div>

<h3>修正ポイント② 新表情: 舌出し・笑い</h3>
<div class="hero">
  <figure><img src="sato/tongue.png" alt="sato tongue"><figcaption>tongue（舌出し）<span class="fix">※目の開閉バリエーションは未生成</span></figcaption></figure>
  <figure><img src="sato/laugh.png" alt="sato laugh"><figcaption>laugh（笑い）</figcaption></figure>
</div>
